on:
  push:
  pull_request:

name: CI

jobs:
  dependency-validation:
    name: Dependency Validation

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: "${{ runner.os }}-${{ hashFiles('**/composer.lock') }}"

      - name: Install Composer
        uses: php-actions/composer@v6

      - name: Ensure that composer.json is valid
        run: composer validate --no-ansi --strict composer.json

      - name: Ensure that dependencies can be installed
        run: composer install --no-ansi --dry-run


  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php-version }})
    runs-on: ${{ matrix.operating-system }}

    needs:
      - dependency-validation

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, openssl, xml
          coverage: xdebug

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-php-${{ matrix.php-version }}-"

      - name: Install dependencies with Composer
        run: composer update --prefer-dist --no-ansi --no-interaction --no-progress

      - name: Run PHPUnit
        run: make test-unit

      - name: Run php-cs-fixer
        env:
          # Suppresses php-cs-fixer warning when running on PHP versions it
          # does not officially support yet (e.g. unreleased minor versions).
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: make php-cs-fixer


  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest

    # Only update the badge on pushes to master, not on PRs, to avoid
    # concurrent writes to the gh-pages branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    needs:
      - unit-tests

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl, xml
          coverage: xdebug

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-php-8.3-"

      - name: Install dependencies with Composer
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress

      - name: Run PHPUnit (with coverage)
        run: php -d xdebug.mode=coverage ./vendor/bin/phpunit

      - name: Make Coverage Badge
        uses: action-badges/cobertura-coverage-xml-badges@0.3.0
        with:
          file-name: coverage.svg
          badge-branch: gh-pages
          coverage-file-name: tests/coverage.latest/coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}
